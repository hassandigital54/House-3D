<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Maison Chris — 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#d4a843;--gold2:#f0c86a;--bg:#0d0f14;
  --ui:rgba(10,12,20,0.92);--border:rgba(212,168,67,0.22);
  --text:#f0ede6;--muted:#7a7a8a;
  --topH:50px;--panW:220px;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none}
canvas{display:block;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%}
#c canvas{width:100%!important;height:100%!important}

/* ══ TOP BAR ══ */
#top{
  position:fixed;top:0;left:0;right:0;height:var(--topH);
  background:var(--ui);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;z-index:300;gap:6px
}
.brand{font-size:clamp(.8rem,3vw,1rem);font-weight:700;color:var(--gold);
       letter-spacing:.1em;white-space:nowrap;flex-shrink:0}
.brand b{color:var(--text);font-weight:300}

/* Toggles in top bar */
.topbtns{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;
         scrollbar-width:none;-ms-overflow-style:none}
.topbtns::-webkit-scrollbar{display:none}
.tb{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--muted);
    font-size:clamp(.48rem,1.8vw,.62rem);padding:5px 8px;border-radius:4px;cursor:pointer;
    text-transform:uppercase;letter-spacing:.06em;transition:all .18s;white-space:nowrap;
    flex-shrink:0;-webkit-tap-highlight-color:transparent}
.tb:hover,.tb.on{border-color:var(--gold);color:var(--gold);background:rgba(212,168,67,.1)}

/* ══ SIDE PANEL — desktop ══ */
#panel{
  position:fixed;right:0;top:var(--topH);
  width:var(--panW);height:calc(100dvh - var(--topH));
  background:var(--ui);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;z-index:200;
  transition:transform .32s cubic-bezier(.4,0,.2,1);will-change:transform;
  overflow:hidden
}
#panel.hide{transform:translateX(var(--panW))}
.ph{padding:12px 12px 8px;border-bottom:1px solid var(--border);
    font-size:.55rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);flex-shrink:0}
.rl{flex:1;overflow-y:auto;padding:6px 4px}
.rl::-webkit-scrollbar{width:2px}
.rl::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.ri{display:flex;align-items:center;gap:7px;padding:8px 8px;border-radius:5px;
    cursor:pointer;border:1px solid transparent;transition:all .15s;margin-bottom:2px;
    -webkit-tap-highlight-color:transparent}
.ri:active,.ri:hover{background:rgba(255,255,255,.04);border-color:var(--border)}
.ri.active{background:rgba(212,168,67,.1);border-color:var(--gold)}
.ri-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.ri-name{font-size:.62rem;letter-spacing:.05em;flex:1}
.ri-m{font-size:.52rem;color:var(--muted)}
.ibox{margin:8px;padding:11px;border:1px solid var(--border);border-radius:6px;
      background:rgba(255,255,255,.02);flex-shrink:0}
.it{font-size:.8rem;font-weight:600;color:var(--gold2);margin-bottom:5px}
.id{font-size:.58rem;color:var(--muted);line-height:1.75}

/* Panel toggle tab */
#ptog{
  position:fixed;top:calc(var(--topH) + 10px);
  right:0;width:28px;height:48px;
  background:var(--ui);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border);border-right:none;border-radius:6px 0 0 6px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:201;color:var(--gold);font-size:1rem;
  transition:right .32s cubic-bezier(.4,0,.2,1);
  -webkit-tap-highlight-color:transparent
}
#ptog.open{right:var(--panW)}

/* ══ BOTTOM PANEL — mobile (≤600px) ══ */
@media(max-width:600px){
  :root{--panW:100%}
  #panel{
    top:auto;bottom:0;left:0;right:0;
    width:100%;height:52vh;max-height:380px;
    border-left:none;border-top:1px solid var(--border);
    border-radius:14px 14px 0 0;
    transform:translateY(100%);
  }
  #panel.hide{transform:translateY(100%)}
  #panel.show{transform:translateY(0)}
  /* handle bar */
  #panel::before{
    content:'';display:block;width:36px;height:4px;
    background:var(--border);border-radius:2px;
    margin:10px auto 2px;flex-shrink:0
  }
  #ptog{
    top:auto;bottom:calc(52vh + 8px);right:12px;
    width:44px;height:44px;border-radius:50%;
    border:1px solid var(--border);
    font-size:1.2rem;
  }
  #ptog.open{right:12px;bottom:calc(52vh + 8px)}
}

/* ══ VIEW BUTTONS ══ */
#views{
  position:fixed;bottom:16px;left:12px;
  display:flex;flex-direction:column;gap:5px;z-index:200
}
.vb{
  background:var(--ui);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border);color:var(--muted);
  font-size:clamp(.48rem,1.6vw,.6rem);
  padding:7px 11px;border-radius:5px;cursor:pointer;
  text-transform:uppercase;letter-spacing:.07em;
  transition:all .18s;text-align:left;white-space:nowrap;
  -webkit-tap-highlight-color:transparent
}
.vb:active,.vb:hover{border-color:var(--gold);color:var(--gold);background:rgba(212,168,67,.08)}

/* On mobile: views become a horizontal scroll row at bottom */
@media(max-width:600px){
  #views{
    flex-direction:row;flex-wrap:nowrap;
    bottom:8px;left:0;right:0;
    padding:0 10px;
    overflow-x:auto;scrollbar-width:none;gap:5px;
    /* Make room above bottom panel toggle */
  }
  #views::-webkit-scrollbar{display:none}
  .vb{padding:6px 10px;font-size:.58rem}
  /* hide some on very small */
}
@media(max-width:380px){
  .vb.hide-xs{display:none}
}

/* ══ LABELS ══ */
#lblayer{position:fixed;inset:0;pointer-events:none;z-index:50}
.lbl{
  position:absolute;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.62);border:1px solid rgba(212,168,67,.4);
  border-radius:4px;padding:3px 7px;
  font-size:clamp(.44rem,1.3vw,.6rem);letter-spacing:.1em;
  color:#fff;text-transform:uppercase;white-space:nowrap;
  backdrop-filter:blur(3px);pointer-events:none;transition:opacity .2s
}

/* ══ COMPASS ══ */
#compass{
  position:fixed;bottom:16px;right:12px;
  width:52px;height:52px;
  background:var(--ui);border:1px solid var(--border);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  z-index:200;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)
}
#ccanvas{width:44px;height:44px}
@media(max-width:600px){
  #compass{bottom:58px;right:12px;width:44px;height:44px}
  #ccanvas{width:36px;height:36px}
}

/* ══ LOADING ══ */
#loading{
  position:fixed;inset:0;background:#080a10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;z-index:999;transition:opacity .6s
}
.lt{font-size:clamp(1rem,5vw,1.6rem);letter-spacing:.3em;color:var(--gold);
    text-transform:uppercase;font-weight:300;text-align:center}
.ls{font-size:clamp(.45rem,1.5vw,.58rem);color:var(--muted);letter-spacing:.2em}
.lb{width:150px;height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.lf{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));
    animation:la 1.1s ease-in-out infinite}
@keyframes la{0%{width:0%;margin-left:0%}50%{width:55%;margin-left:22%}100%{width:0%;margin-left:100%}}

/* ══ HINT ══ */
#hint{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  background:var(--ui);border:1px solid var(--border);border-radius:20px;
  padding:6px 14px;font-size:clamp(.45rem,1.4vw,.58rem);color:var(--muted);
  letter-spacing:.07em;backdrop-filter:blur(10px);z-index:200;
  white-space:nowrap;pointer-events:none;transition:opacity .6s
}
@media(max-width:600px){
  #hint{display:none}
}
</style>
</head>
<body>

<div id="loading">
  <div class="lt">Maison · Chris</div>
  <div class="lb"><div class="lf"></div></div>
  <div class="ls">CONSTRUCTION 3D…</div>
</div>

<div id="c"></div>
<div id="lblayer"></div>

<!-- TOP BAR -->
<div id="top">
  <div class="brand">MAISON <b>· Chris</b></div>
  <div class="topbtns">
    <button class="tb on"  id="btnRoof">🏠 Toit</button>
    <button class="tb on"  id="btnWall">🧱 Murs</button>
    <button class="tb on"  id="btnLbl" >🏷 Labels</button>
    <button class="tb"     id="btnSun" >☀ Soleil</button>
    <button class="tb"     id="btnWire">⬡ Filaire</button>
  </div>
</div>

<!-- SIDE / BOTTOM PANEL -->
<div id="panel">
  <div class="ph">Pièces de la maison</div>
  <div class="rl" id="rl"></div>
  <div class="ibox" id="ibox">
    <div class="it">Sélectionner une pièce</div>
    <div class="id">Cliquez sur une pièce dans la liste ou tapez sur la scène.</div>
  </div>
</div>
<div id="ptog">‹</div>

<!-- VIEW BUTTONS -->
<div id="views">
  <button class="vb" data-v="iso">◈ Iso</button>
  <button class="vb" data-v="front">↑ Façade</button>
  <button class="vb" data-v="back">↓ Arrière</button>
  <button class="vb hide-xs" data-v="left">← Côté</button>
  <button class="vb" data-v="top">⊙ Dessus</button>
  <button class="vb" data-v="inside">👁 Intérieur</button>
</div>

<div id="compass"><canvas id="ccanvas" width="44" height="44"></canvas></div>
<div id="hint">🖱 Glisser · Tourner &nbsp;|&nbsp; Scroll · Zoom &nbsp;|&nbsp; Clic droit · Pan</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ══════════════════════════════════════════════
// MAISON CHRIS — 3D Full Interior
// 1 unit = 1 mètre  |  Plan 7.5m × 11.5m
// ══════════════════════════════════════════════
const WH=2.7, WT=0.18, FT=0.1;

const ROOMS=[
  {id:'garage', name:'Garage',         label:'GARAGE',        x:0,   z:0,   w:7.5, d:3.5, floor:0x6a6a6a,wall:0xaaaaaa,ceil:0xcccccc,m2:'~17m²',info:'Garage double · Porte sectionnelle · Sol béton'},
  {id:'sam',    name:'S.A.M.',         label:'S.A.M.',        x:1.5, z:3.5, w:6.0, d:3.5, floor:0xb8883e,wall:0xe8d8b8,ceil:0xf0e8d0,m2:'~18m²',info:'Salle à Manger · Parquet chêne · Espace lumineux'},
  {id:'salon',  name:'Salon',          label:'SALON',         x:1.5, z:7.0, w:3.5, d:2.0, floor:0xc09840,wall:0xeadcb8,ceil:0xf2ecd8,m2:'~15m²',info:'Salon · Séjour · Baie vitrée vers terrasse'},
  {id:'ter',    name:'Terrasse',       label:'TERRASSE',      x:0,   z:3.5, w:1.5, d:6.0, floor:0x7a8a6a,wall:0xaab89a,ceil:null,    m2:'~9m²', info:'Terrasse couverte · Dallage · Exposition est',exterior:true},
  {id:'ch1',    name:'Ch. Principale', label:'CH. PRINCIPALE',x:1.5, z:9.0, w:3.5, d:2.5, floor:0xa88050,wall:0xdcc8a8,ceil:0xeedfcc,m2:'~14m²',info:'Chambre principale · Parquet · Grande fenêtre'},
  {id:'ch2',    name:'Chambre 2',      label:'CHAMBRE 2',     x:5.0, z:7.0, w:2.5, d:4.5, floor:0xb49060,wall:0xe0ccb0,ceil:0xf0e4d0,m2:'~10m²',info:'Chambre 2 · Parquet · Penderie · Bureau'},
  {id:'cui',    name:'Cuisine',        label:'CUISINE',       x:1.5, z:7.0, w:1.5, d:1.0, floor:0xa89474,wall:0xddd0c0,ceil:0xeee4d4,m2:'~5m²', info:'Cuisine équipée · Carrelage · Plan de travail'},
  {id:'sdb',    name:"Salle d'Eau",    label:'SDB',           x:1.5, z:8.0, w:1.5, d:1.0, floor:0x5a8494,wall:0xb8d8e4,ceil:0xd0e8f0,m2:'~5m²', info:"Salle d'eau · Douche italienne · Carrelage"},
  {id:'wc',     name:'WC',             label:'WC',            x:3.0, z:7.5, w:1.0, d:1.2, floor:0x4a7484,wall:0xa8c8d4,ceil:0xc8e0ea,m2:'~2m²', info:'WC séparé · Carrelage · Ventilation'},
];

// ── Renderer ──
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
document.getElementById('c').appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0d1018);
scene.fog=new THREE.FogExp2(0x0d1018,0.018);
const camera=new THREE.PerspectiveCamera(50,1,0.1,300);

// ── Lights ──
scene.add(new THREE.AmbientLight(0xffe8d0,0.5));
const sun=new THREE.DirectionalLight(0xfff5e0,2.0);
sun.position.set(14,22,12);sun.castShadow=true;
sun.shadow.bias=-0.001;
sun.shadow.camera.left=-25;sun.shadow.camera.right=25;
sun.shadow.camera.top=25;sun.shadow.camera.bottom=-25;
sun.shadow.camera.near=1;sun.shadow.camera.far=80;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);
scene.add(new THREE.DirectionalLight(0xc0d8ff,0.45).position.set(-10,8,-12)&&sun||new THREE.DirectionalLight(0xc0d8ff,0.45));
const fill2=new THREE.DirectionalLight(0xc0d8ff,0.45);fill2.position.set(-10,8,-12);scene.add(fill2);
scene.add(new THREE.HemisphereLight(0x8ab4ff,0x4a3020,0.3));
[[3.75,1.8,1.75,0xffe0a0,1.5,6],[4.5,1.8,5.25,0xfff0c0,1.2,7],
 [3.25,1.8,8.0,0xffe8b0,1.0,6],[6.25,1.8,9.25,0xfff0d0,1.0,6],
 [3.25,1.8,10.25,0xffe8c0,0.9,5]].forEach(([x,y,z,c,i,d])=>{
  const l=new THREE.PointLight(c,i,d);l.position.set(x,y,z);scene.add(l);
});

// ── Materials ──
const M=(color,rough=0.85,metal=0.02)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,side:THREE.DoubleSide});
const GM=(color=0x88ccee)=>new THREE.MeshStandardMaterial({color,roughness:0.05,metalness:0.1,transparent:true,opacity:0.35,side:THREE.DoubleSide});

// ── Box helper ──
function box(w,h,d,mat,cx,cy,cz,parent){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(cx,cy,cz);m.castShadow=true;m.receiveShadow=true;
  parent.add(m);return m;
}

// ── Groups ──
const houseG=new THREE.Group(),roofG=new THREE.Group(),wallsG=new THREE.Group();
scene.add(houseG);houseG.add(roofG);houseG.add(wallsG);

// ── Floors ──
ROOMS.forEach(r=>box(r.w-WT,FT,r.d-WT,M(r.floor,0.9),r.x+r.w/2,FT/2,r.z+r.d/2,houseG));
box(9,0.06,14,M(0x222228,1),3.75,-0.03,5.75,houseG);

// ── Wall segment ──
function wseg(wx,wy,wz,ww,wh,wd,m,parent){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(ww,wh,wd),m);
  mesh.position.set(wx,wy,wz);mesh.castShadow=true;mesh.receiveShadow=true;
  parent.add(mesh);return mesh;
}

// ── Wall with openings ──
function wallOpen(parent,wm,wx,wz,len,height,thick,axis,openings){
  openings=[...openings].sort((a,b)=>a.offset-b.offset);
  let cur=0;const half=len/2;
  const seg=(cx,cy,cz,w,h,d)=>wseg(cx,cy,cz,w,h,d,wm,parent);
  openings.forEach(op=>{
    const slen=op.offset-cur;
    if(slen>0.02){
      const cx=axis==='x'?wx-half+cur+slen/2:wx;
      const cz=axis==='z'?wz-half+cur+slen/2:wz;
      seg(cx,height/2,cz,axis==='x'?slen:thick,height,axis==='z'?slen:thick);
    }
    cur=op.offset+op.width;
    const bot=op.fromBottom||0;
    const abH=height-bot-op.height;
    const cx2=axis==='x'?wx-half+op.offset+op.width/2:wx;
    const cz2=axis==='z'?wz-half+op.offset+op.width/2:wz;
    if(abH>0.02) seg(cx2,height-abH/2,cz2,axis==='x'?op.width:thick,abH,axis==='z'?op.width:thick);
    if(bot>0.02)  seg(cx2,bot/2,cz2,axis==='x'?op.width:thick,bot,axis==='z'?op.width:thick);
  });
  if(cur<len-0.02){
    const slen=len-cur;
    const cx=axis==='x'?wx-half+cur+slen/2:wx;
    const cz=axis==='z'?wz-half+cur+slen/2:wz;
    seg(cx,height/2,cz,axis==='x'?slen:thick,height,axis==='z'?slen:thick);
  }
}

const extM=M(0xd4c8b0,0.88),extMd=M(0xc0b4a0,0.88),intM=M(0xe8e0d0,0.9),intM2=M(0xddd4c4,0.9);

// Exterior walls
wallOpen(wallsG,extM, 3.75,WT/2,      7.5,WH,WT,'x',[{offset:1.4,width:4.5,height:2.2,fromBottom:0}]);
wallOpen(wallsG,extMd,3.75,11.5-WT/2, 7.5,WH,WT,'x',[{offset:1.8,width:1.2,height:1.1,fromBottom:0.9},{offset:5.0,width:1.0,height:1.1,fromBottom:0.9}]);
wallOpen(wallsG,extM, WT/2,5.75,     11.5,WH,WT,'z',[]);
wallOpen(wallsG,extMd,7.5-WT/2,5.75, 11.5,WH,WT,'z',[{offset:0.4,width:0.8,height:0.5,fromBottom:0.4},{offset:4.0,width:1.0,height:1.1,fromBottom:0.9},{offset:5.5,width:1.0,height:1.1,fromBottom:0.9},{offset:7.2,width:0.9,height:1.1,fromBottom:0.9}]);

// Interior walls
wallOpen(wallsG,intM, 4.5,3.5,   6.0,WH,WT,'x',[{offset:3.5,width:1.0,height:2.1,fromBottom:0}]);
wallOpen(wallsG,intM2,1.5,6.5,   6.0,WH,WT,'z',[{offset:3.3,width:0.9,height:2.1,fromBottom:0}]);
wallOpen(wallsG,intM, 3.25,7.0,  3.5,WH,WT,'x',[{offset:1.8,width:0.9,height:2.1,fromBottom:0}]);
wallOpen(wallsG,intM2,3.0,7.5,   1.0,WH,WT,'z',[{offset:0.05,width:0.75,height:2.1,fromBottom:0}]);
wallOpen(wallsG,intM, 2.25,8.0,  1.5,WH,WT,'x',[{offset:0.1,width:0.8,height:2.1,fromBottom:0}]);
wallOpen(wallsG,intM2,3.0,8.1,   1.2,WH,WT,'z',[{offset:0.1,width:0.7,height:2.1,fromBottom:0}]);
wseg(3.5,WH/2,8.7,1.0,WH,WT,intM,wallsG);
wallOpen(wallsG,intM, 3.25,9.0,  3.5,WH,WT,'x',[{offset:2.0,width:0.9,height:2.1,fromBottom:0}]);
wallOpen(wallsG,intM2,5.0,9.25,  4.5,WH,WT,'z',[{offset:0.1,width:0.9,height:2.1,fromBottom:0}]);
wallOpen(wallsG,intM, 6.25,7.0,  2.5,WH,WT,'x',[{offset:0.8,width:0.9,height:2.1,fromBottom:0}]);

// Ceilings
ROOMS.forEach(r=>{
  if(r.exterior)return;
  box(r.w,0.05,r.d,new THREE.MeshStandardMaterial({color:r.ceil||0xf0ece0,roughness:1,transparent:true,opacity:0.18,side:THREE.FrontSide}),r.x+r.w/2,WH+0.025,r.z+r.d/2,houseG);
});

// Windows
const glM=GM(0x88d8f8),frM=M(0xd4d0c0,0.5,0.1);
function addWin(x,y,z,ww,wh,axis){
  const fw=axis==='x'?ww+0.06:WT+0.02,fh=wh+0.06,fd=axis==='z'?ww+0.06:WT+0.02;
  box(fw,fh,fd,frM,x,y,z,houseG);
  box(axis==='x'?ww-0.05:0.03,wh-0.05,axis==='z'?ww-0.05:0.03,glM,x,y,z,houseG);
  box(fw+0.04,0.06,fd+0.04,M(0xd8d0b8,0.6),x,y-wh/2-0.03,z,houseG);
  // cross bar

function rfFace(v0,v1,v2,v3){
  const pos=[],nrm=[],quads=v3?[[v0,v1,v2],[v0,v2,v3]]:[[v0,v1,v2]];
  quads.forEach(([a,b,c])=>{
    pos.push(...a,...b,...c);
    const ab=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],ac=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
    const n=[ab[1]*ac[2]-ab[2]*ac[1],ab[2]*ac[0]-ab[0]*ac[2],ab[0]*ac[1]-ab[1]*ac[0]];
    const l=Math.hypot(...n);const nn=n.map(x=>x/l);
    nrm.push(...nn,...nn,...nn);
  });
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  const m=new THREE.Mesh(g,roofM);m.castShadow=true;roofG.add(m);
}

  projMat.multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse);
  frustum.setFromProjectionMatrix(projMat);
  const W=renderer.domElement.clientWidth,H=renderer.domElement.clientHeight;
  labels3.forEach(l=>{
    const s=l.pos.clone().project(camera);
    const x=(s.x*0.5+0.5)*W,y=(-s.y*0.5+0.5)*H;
    const vis=frustum.containsPoint(l.pos)&&s.z<1;
    l.el.style.display=vis&&showLbl?'block':'none';
    l.el.style.left=x+'px';l.el.style.top=y+'px';
    const isSel=selId===l.r.id;
    l.el.style.borderColor=isSel?'var(--gold)':'rgba(212,168,67,.4)';
    l.el.style.color=isSel?'var(--gold2)':'#fff';
  });
}

// ── COMPASS ──
const cc=document.getElementById('ccanvas'),cx2=cc.getContext('2d');
function drawCompass(){
  const S=cc.width;cx2.clearRect(0,0,S,S);
  cx2.save();cx2.translate(S/2,S/2);cx2.rotate(-sph.theta);
  cx2.beginPath();cx2.moveTo(0,-S*0.35);cx2.lineTo(S*0.1,S*0.1);cx2.lineTo(0,S*0.05);cx2.lineTo(-S*0.1,S*0.1);cx2.closePath();
  cx2.fillStyle='#d4a843';cx2.fill();
  cx2.beginPath();cx2.moveTo(0,S*0.35);cx2.lineTo(S*0.1,-S*0.1);cx2.lineTo(0,-S*0.05);cx2.lineTo(-S*0.1,-S*0.1);cx2.closePath();
  cx2.fillStyle='#444';cx2.fill();
  cx2.restore();
  cx2.strokeStyle='#2a2a3a';cx2.lineWidth=1;
  cx2.beginPath();cx2.arc(S/2,S/2,S/2-1,0,Math.PI*2);cx2.stroke();
  cx2.fillStyle='#d4a843';cx2.font=`bold ${Math.max(6,S*0.16)}px sans-serif`;cx2.textAlign='center';
  cx2.fillText('N',S/2,S*0.2);
}

// ── RESIZE ──
function resize(){
  const c=document.getElementById('c'),w=c.clientWidth,h=c.clientHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();

// ── ANIM ──
function lerp(a,b,t){return a+(b-a)*t;}
let sunAng=0;
function animLoop(){
  requestAnimationFrame(animLoop);
  sph.theta=lerp(sph.theta,tSph.theta,0.1);
  sph.phi=lerp(sph.phi,tSph.phi,0.1);
  sph.r=lerp(sph.r,tSph.r,0.1);
  tgt.lerp(tTgt,0.1);
  if(sunAnim){
    sunAng+=0.004;
    sun.position.set(Math.cos(sunAng)*22,14+Math.sin(sunAng)*9,Math.sin(sunAng)*18);
    sun.intensity=0.7+Math.max(0,Math.sin(sunAng))*1.5;
    const t=(Math.sin(sunAng)+1)/2;sun.color.setRGB(1,0.65+t*0.35,0.25+t*0.75);
  }
  moveCam();updateLabels();drawCompass();
  renderer.render(scene,camera);
}

setTimeout(()=>{const ld=document.getElementById('loading');ld.style.opacity='0';setTimeout(()=>ld.remove(),600);},1200);
setTimeout(()=>{const h=document.getElementById('hint');if(h){h.style.opacity='0';setTimeout(()=>h.remove(),500);}},5000);
animLoop();
</script>
